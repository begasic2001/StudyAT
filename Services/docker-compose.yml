services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=Monkeydluffy@123
    ports:
      - 5432:5432
    volumes:
      - /var/lib/postgresql/data
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopw
    ports:
      - 27017:27017
    volumes:
      - /var/lib/mongodb/data

